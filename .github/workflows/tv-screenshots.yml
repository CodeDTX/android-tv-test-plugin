name: TV Screenshots (reusable)

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      flavor:
        description: Flavor name capitalised for Gradle tasks. Leave empty for no-flavor projects.
        required: false
        default: ""
        type: string
      app-id:
        required: true
        type: string
      api-level:
        required: false
        type: number
        default: 34
      tv-profile:
        description: Android TV AVD hardware profile
        required: false
        type: string
        default: tv_1080p
      runner:
        description: Runner label to use, e.g. ubuntu-latest or self-hosted
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      CODEDTX_GITHUB_TOKEN:
        required: true

jobs:
  screenshots:
    name: Capture Screenshots
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CODEDTX_GITHUB_USER: codedtx-ci
      CODEDTX_GITHUB_TOKEN: ${{ secrets.CODEDTX_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APKs
        run: |
          ./gradlew :${{ inputs.module }}:assemble${{ inputs.flavor }}Debug
          ./gradlew :${{ inputs.module }}:assemble${{ inputs.flavor }}DebugAndroidTest

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ inputs.tv-profile }}
          avd-name: tv_screenshot_avd
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell pm clear ${{ inputs.app-id }} || true
            bash -c 'set +e; APK_DIR=${{ inputs.module }}/build/outputs/apk; adb install -r "$APK_DIR/${{ inputs.flavor }}/debug/"*-debug.apk; adb install -r "$APK_DIR/androidTest/${{ inputs.flavor }}/debug/"*-androidTest.apk; adb shell am instrument -w -e class ${{ inputs.app-id }}.ScreenshotTest ${{ inputs.app-id }}.test/androidx.test.runner.AndroidJUnitRunner; TEST_EXIT=$?; echo "===== PULLING SCREENSHOTS ====="; mkdir -p ./tv_screenshots; adb pull /sdcard/Android/data/${{ inputs.app-id }}/files/Pictures/screenshots/ ./tv_screenshots/ || true; echo "===== LOCAL SCREENSHOTS ====="; ls -la ./tv_screenshots/ 2>/dev/null || true; PNG_COUNT=$(find ./tv_screenshots -name "*.png" | wc -l); echo "PNG count: $PNG_COUNT | am instrument exit: $TEST_EXIT"; if [ "$PNG_COUNT" -eq 0 ] && [ "$TEST_EXIT" -eq 0 ]; then echo "ERROR: tests passed but zero PNGs collected"; exit 1; fi; exit "$TEST_EXIT"'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-ui-screenshots
          path: tv_screenshots/
          if-no-files-found: warn

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: ${{ inputs.module }}/build/reports/androidTests/
          if-no-files-found: ignore
