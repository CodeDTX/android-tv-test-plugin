name: Publish to GitHub Packages

on:
  push:
    tags: [ '*.*.*' ]           # triggers on 1.0.0, 1.1.0, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Publish library and plugin
        run: |
          ./gradlew :tv-test-utils:publish -PVERSION_NAME=${{ github.ref_name }}
          ./gradlew :tv-test-plugin:publish -PVERSION_NAME=${{ github.ref_name }}
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY:  ${{ secrets.GITHUB_TOKEN }}

      - name: Move v1 floating tag to latest release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1
          git push origin v1 --force
