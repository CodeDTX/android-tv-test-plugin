name: Verify JitPack Build

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Verify publishToMavenLocal (mirrors JitPack build)
        run: |
          ./gradlew :tv-test-utils:publishToMavenLocal :tv-test-plugin:publishToMavenLocal \
            -PVERSION_NAME=${{ github.ref_name }}

      - name: Move v1 floating tag to latest release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1
          git push origin v1 --force
