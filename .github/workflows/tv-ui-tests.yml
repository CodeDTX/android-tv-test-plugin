name: TV UI Tests (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: Gradle module name, e.g. my-tv-app
        required: true
        type: string
      flavor:
        description: Flavor name capitalised for Gradle tasks, e.g. Production or Staging. Leave empty for no-flavor projects.
        required: false
        default: ""
        type: string
      app-id:
        description: Base applicationId from defaultConfig (flavor suffix included if applicable, build-type suffix e.g. .debug excluded — Gradle handles this automatically)
        required: true
        type: string
      api-level:
        description: Android API level for emulator
        required: false
        type: number
        default: 34
      runner:
        description: Runner label to use, e.g. ubuntu-latest or self-hosted
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      CODEDTX_GITHUB_TOKEN:
        required: true

jobs:
  ui-tests:
    name: Run UI Tests
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    env:
      CODEDTX_GITHUB_USER: codedtx-ci
      CODEDTX_GITHUB_TOKEN: ${{ secrets.CODEDTX_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APKs
        run: |
          ./gradlew :${{ inputs.module }}:assemble${{ inputs.flavor }}Debug
          ./gradlew :${{ inputs.module }}:assemble${{ inputs.flavor }}DebugAndroidTest

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86
          target: android-tv
          profile: tv_1080p
          avd-name: tv_ui_test_avd_atv
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell pm clear ${{ inputs.app-id }} || true
            ./gradlew :${{ inputs.module }}:connected${{ inputs.flavor }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=${{ inputs.app-id }}.UiTest -Pandroid.testInstrumentationRunnerArguments.clearPackageData=true

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ${{ inputs.module }}/build/reports/androidTests/
            ${{ inputs.module }}/build/outputs/androidTest-results/

      - name: Collect logcat on failure
        if: failure()
        run: timeout 10 adb logcat -d > /tmp/logcat.txt || true

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-ui-tests
          path: /tmp/logcat.txt
          if-no-files-found: ignore
